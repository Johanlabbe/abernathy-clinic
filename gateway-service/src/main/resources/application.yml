server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: patient-service
          uri: http://localhost:8081
          predicates:
            - Path=/patient/**
        - id: note-service
          uri: http://localhost:8083
          predicates:
            - Path=/note/**
        - id: assessment-service
          uri: http://localhost:8084
          predicates:
            - Path=/assessment/**