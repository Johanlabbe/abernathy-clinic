server:
  port: 8080

spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI:http://localhost:8090/realms/abernathy}
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8090/realms/abernathy/protocol/openid-connect/certs}
  cloud:
    gateway:
      routes:
        - id: patient-service
          uri: http://${PATIENT_HOST:localhost}:${PATIENT_PORT:8081}
          predicates:
            - Path=/patient/**
        - id: note-service
          uri: http://${NOTE_HOST:localhost}:${NOTE_PORT:8083}
          predicates:
            - Path=/note/**
        - id: assessment-service
          uri: http://${ASSESSMENT_HOST:localhost}:${ASSESSMENT_PORT:8084}
          predicates:
            - Path=/assessment/**
