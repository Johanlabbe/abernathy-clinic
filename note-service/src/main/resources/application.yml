server:
  port: 8083

spring:
  application:
    name: note-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI:http://localhost:8090/realms/abernathy}
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8090/realms/abernathy/protocol/openid-connect/certs}
  data:
    mongodb:
      uri: mongodb://${MONGO_USER:root}:${MONGO_PASSWORD:password}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:abernathy_note}?authSource=admin
