services:
  mysql:
    image: mysql:8.4
    container_name: abernathy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: abernathy_patient
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - abernathy-net

  mongo:
    image: mongo:7
    container_name: abernathy-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - abernathy-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: abernathy-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8090
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-abernathy.json:/opt/keycloak/data/import/realm-abernathy.json:ro
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - abernathy-net

  patient-service:
    build:
      context: .
      dockerfile: patient-service/Dockerfile
    container_name: abernathy-patient
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: abernathy_patient
      DB_USER: root
      DB_PASSWORD: password
      ISSUER_URI: http://localhost:8090/realms/abernathy
      JWK_SET_URI: http://keycloak:8080/realms/abernathy/protocol/openid-connect/certs
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - abernathy-net

  note-service:
    build:
      context: .
      dockerfile: note-service/Dockerfile
    container_name: abernathy-note
    restart: unless-stopped
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: root
      MONGO_PASSWORD: password
      MONGO_DB: abernathy_note
      ISSUER_URI: http://localhost:8090/realms/abernathy
      JWK_SET_URI: http://keycloak:8080/realms/abernathy/protocol/openid-connect/certs
    depends_on:
      mongo:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - abernathy-net

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: abernathy-gateway
    restart: unless-stopped
    environment:
      PATIENT_HOST: patient-service
      PATIENT_PORT: 8081
      NOTE_HOST: note-service
      NOTE_PORT: 8083
      ASSESSMENT_HOST: assessment-service
      ASSESSMENT_PORT: 8084
      ISSUER_URI: http://localhost:8090/realms/abernathy
      JWK_SET_URI: http://keycloak:8080/realms/abernathy/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      patient-service:
        condition: service_started
      note-service:
        condition: service_started
      assessment-service:
        condition: service_started
    networks:
      - abernathy-net

  assessment-service:
    build:
      context: .
      dockerfile: assessment-service/Dockerfile
    container_name: abernathy-assessment
    restart: unless-stopped
    environment:
      GATEWAY_HOST: gateway-service
      GATEWAY_PORT: 8080
      ISSUER_URI: http://localhost:8090/realms/abernathy
      JWK_SET_URI: http://keycloak:8080/realms/abernathy/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - abernathy-net

  front-end:
    build:
      context: .
      dockerfile: front-end/Dockerfile
    container_name: abernathy-front
    restart: unless-stopped
    environment:
      GATEWAY_HOST: gateway-service
      GATEWAY_PORT: 8080
      KC_AUTH_URI: http://localhost:8090/realms/abernathy/protocol/openid-connect/auth
      KC_TOKEN_URI: http://keycloak:8080/realms/abernathy/protocol/openid-connect/token
      KC_JWKS_URI: http://keycloak:8080/realms/abernathy/protocol/openid-connect/certs
      KC_USERINFO_URI: http://keycloak:8080/realms/abernathy/protocol/openid-connect/userinfo
      KC_LOGOUT_URI: http://localhost:8090/realms/abernathy/protocol/openid-connect/logout
      KC_CLIENT_ID: abernathy-front
      KC_CLIENT_SECRET: abernathy-front-secret
    ports:
      - "8082:8082"
    depends_on:
      gateway-service:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - abernathy-net

volumes:
  mysql-data:
  mongo-data:

networks:
  abernathy-net:
    driver: bridge
