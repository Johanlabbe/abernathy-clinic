<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Abernathy Clinic - Patients</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-bottom: 10px;">
        <span>Connecté en tant que <strong sec:authentication="name">utilisateur</strong></span>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit"
                style="padding: 6px 12px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">
                Déconnexion</button>
        </form>
    </div>

    <h1>Liste des Patients - Abernathy Clinic</h1>

    <a th:href="@{/patient/add}"
        style="display: inline-block; margin-bottom: 20px; padding: 10px; background-color: #28a745; color: white; text-decoration: none; border-radius: 4px;">+
        Ajouter un Patient</a>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <table th:if="${patients}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Prénom</th>
                <th>Nom</th>
                <th>Date de Naissance</th>
                <th>Genre</th>
                <th>Adresse</th>
                <th>Téléphone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="patient : ${patients}">
                <td th:text="${patient.id}"></td>
                <td th:text="${patient.prenom}"></td>
                <td th:text="${patient.nom}"></td>
                <td th:text="${patient.dateNaissance}"></td>
                <td th:text="${patient.genre}"></td>
                <td th:text="${patient.adresse}"></td>
                <td th:text="${patient.telephone}"></td>
                <td>
                    <a th:href="@{/patient/details/{id}(id=${patient.id})}" style="color: #007bff; text-decoration: underline;">Détails</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
