<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Abernathy Clinic - Patients</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
       .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Liste des Patients - Abernathy Clinic</h1>
    
    <p class="error" th:if="${error}" th:text="${error}"></p>
    
    <table th:if="${patients}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Prénom</th>
                <th>Nom</th>
                <th>Date de Naissance</th>
                <th>Genre</th>
                <th>Adresse</th>
                <th>Téléphone</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="patient : ${patients}">
                <td th:text="${patient.id}"></td>
                <td th:text="${patient.prenom}"></td>
                <td th:text="${patient.nom}"></td>
                <td th:text="${patient.dateNaissance}"></td>
                <td th:text="${patient.genre}"></td>
                <td th:text="${patient.adresse}"></td>
                <td th:text="${patient.telephone}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
